[project]
name = "tokeniq-backend"
version = "0.1.0"
description = "TokenIQ algo trading bot backend (FastAPI + Delta Exchange testnet)"
authors = [
    { name = "Aditya Doshi", email = "adityadoshi25@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.149.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pydantic-settings>=2.16.0",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
